<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f5f88">
  <title>wardround.app — Clinical notes & tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    /* Hide the app shell until the auth gate clears it. The body class is
       toggled to `.auth-ready` by main.tsx once a fully-authenticated user
       reaches the "ready" stage. */
    body:not(.auth-ready) > .topbar,
    body:not(.auth-ready) > main.app,
    body:not(.auth-ready) > .toast-container,
    body:not(.auth-ready) > .mobile-fab {
      display: none !important;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-D70QT7Ok.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-Dh1Zd6nu.css">
</head>
<body>
  <div id="auth-gate"></div>
  <header class="topbar">
    <div class="brand" id="brand-home">
      <span class="brand-meta">
        <span class="title">wardround.app</span>
        <span class="subtitle">Clinical notes & tasks</span>
      </span>
    </div>
    <div class="header-right">
      <div id="group-switcher-root"></div>
      <div class="session-strip" aria-live="polite">
        <span id="session-user-chip" class="session-chip">User: --</span>
      </div>
      <!-- HIDDEN-FEATURE: ward-notes — remove `hidden` to reinstate -->
      <button id="print-open-btn" class="icon-btn small" type="button" aria-label="Print" hidden>Print</button>
      <div class="users-dropdown">
        <button id="users-btn" class="icon-btn" aria-haspopup="true" aria-expanded="false" aria-controls="users-menu"><span>Settings</span><svg class="cb-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="14" height="14" fill="currentColor" aria-hidden="true"><polygon points="16 22 6 12 7.4 10.6 16 19.2 24.6 10.6 26 12"/></svg></button>
        <div id="users-menu" class="users-menu" role="menu" hidden>
          <button id="manage-tags-btn" class="users-menu-item" type="button" role="menuitem">Manage tags &amp; locations</button>
        </div>
      </div>
    </div>
  </header>
  <main class="app">
    <div id="mobile-topbar" class="mobile-topbar" hidden>
      <button id="mobile-topbar-prev" class="mobile-topbar-icon mobile-topbar-nav" type="button" aria-label="Previous tab">
        <svg class="cb-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="22" height="22" fill="currentColor" aria-hidden="true"><polygon points="10 16 20 6 21.4 7.4 12.8 16 21.4 24.6 20 26"/></svg>
      </button>
      <h1 id="mobile-topbar-title" class="mobile-topbar-title">Task list</h1>
      <button id="mobile-topbar-next" class="mobile-topbar-icon mobile-topbar-nav" type="button" aria-label="Next tab">
        <svg class="cb-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="22" height="22" fill="currentColor" aria-hidden="true"><polygon points="22 16 12 26 10.6 24.6 19.2 16 10.6 7.4 12 6"/></svg>
      </button>
      <div class="mobile-topbar-actions">
        <button id="mobile-search-btn" class="mobile-topbar-icon" type="button" aria-label="Search tasks" hidden>
          <svg class="cb-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M29,27.5859l-7.5521-7.5521a11.0177,11.0177,0,1,0-1.4141,1.4141L27.5859,29ZM4,13a9,9,0,1,1,9,9A9.01,9.01,0,0,1,4,13Z"/></svg>
        </button>
        <button id="mobile-filter-btn" class="mobile-filter-pill" type="button" aria-label="Filter tasks" hidden>
          <svg class="cb-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M18,28H14a2,2,0,0,1-2-2V18.41L4.59,11A2,2,0,0,1,4,9.59V6A2,2,0,0,1,6,4H26a2,2,0,0,1,2,2V9.59A2,2,0,0,1,27.41,11L20,18.41V26A2,2,0,0,1,18,28ZM6,6V9.59l8,8V26h4V17.59l8-8V6Z"/></svg>
          <span class="mobile-filter-label">Filter</span>
          <span id="mobile-filter-count" class="mobile-filter-count" hidden>0</span>
        </button>
        <button id="mobile-overflow-btn" class="mobile-topbar-icon" type="button" aria-label="More options">
          <svg class="cb-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="22" height="22" fill="currentColor" aria-hidden="true"><circle cx="16" cy="8" r="2"/><circle cx="16" cy="16" r="2"/><circle cx="16" cy="24" r="2"/></svg>
        </button>
      </div>
    </div>
    <div id="mobile-search-bar" class="mobile-search-bar" hidden>
      <input id="mobile-search-input" type="search" placeholder="Search tasks" autocomplete="off">
      <button id="mobile-search-close" class="icon-btn small" type="button" aria-label="Close search">Cancel</button>
    </div>
    <div class="tabs-bar">
      <div id="main-tabs" class="tabs">
        <button id="tab-table" class="tab active" role="tab" aria-selected="true" aria-controls="table-section">Table</button>
        <button id="tab-my" class="tab" role="tab" aria-selected="false" aria-controls="user-detail">Task list</button>
        <button id="tab-updates" class="tab" role="tab" aria-selected="false" aria-controls="updates-section">Updates</button>
      </div>
      <div class="tabs-actions">
        <!-- HIDDEN-FEATURE: ward-notes — remove `hidden` to reinstate -->
        <button id="quick-ward-notes-btn" class="btn" type="button" hidden>Ward Notes</button>
        <button id="quick-new-case-btn" class="btn primary" type="button">New patient</button>
      </div>
    </div>

    <div id="active-workspace-banner" class="active-workspace-banner" hidden>
      <span class="aw-banner-label">Workspace</span>
      <span id="active-workspace-name" class="aw-banner-name">--</span>
      <span class="aw-banner-hint">New patients you create will be saved here.</span>
    </div>

    <section id="table-section" class="card" hidden>
      <div id="table-tags-controls" class="tags-controls" aria-label="Tag filters and sort">
        <div class="left">
          <label class="ctrl">
            Location
            <select id="filter-location" multiple size="1" title="Filter by ward"></select>
          </label>
          <label class="ctrl">
            Consultant
            <select id="filter-consultant" multiple size="1" title="Filter by consultant"></select>
          </label>
        </div>
        <div class="right">
          <label class="ctrl">
            Sort by
            <select id="sort-by-tag">
              <option value="none">None</option>
              <option value="location">Location</option>
              <option value="room">Room</option>
              <option value="consultant">Consultant</option>
            </select>
          </label>
          <!-- HIDDEN-FEATURE: ward-notes — remove `hidden` to reinstate -->
          <button id="ward-notes-print-btn" class="icon-btn small" type="button" hidden>Ward Notes</button>
          <button id="clear-tag-filters" class="icon-btn small" type="button">Clear</button>
          <button id="hide-filters-btn" class="icon-btn small" type="button" aria-label="Hide filters">Hide</button>
        </div>
      </div>
      <div class="table-section-toolbar" aria-label="Table controls">
        <button id="mobile-expand-all-btn" class="mobile-expand-all-btn" type="button" aria-pressed="false">Expand all</button>
        <button id="show-filters-btn" class="show-filters-btn" type="button" hidden>Show Filters</button>
      </div>
      <div id="table-root" class="table-root" aria-label="Cases table view"></div>
    </section>
    

    <section id="case-detail" class="card" hidden>
      <button id="back-btn" class="back-btn" aria-label="Back to cases"><svg class="cb-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="14" height="14" fill="currentColor" aria-hidden="true"><polygon points="14 26 15.41 24.59 7.83 17 28 17 28 15 7.83 15 15.41 7.41 14 6 4 16 14 26"/></svg><span>Back</span></button>
      <h2 id="case-title" class="case-heading"></h2>
      <div id="case-header-actions" class="case-header-actions"></div>
      <div id="case-tag-chips" class="tag-chips" aria-label="Case tags"></div>

      <div id="case-mobile-tabs" class="case-mobile-tabs" role="tablist" aria-label="Case sections">
        <button class="case-mobile-tab active" data-panel="overview" type="button" role="tab" aria-selected="true">Overview</button>
        <button class="case-mobile-tab" data-panel="tasks" type="button" role="tab" aria-selected="false">Tasks</button>
        <!-- HIDDEN-FEATURE: ward-notes — remove `hidden` to reinstate -->
        <button class="case-mobile-tab" data-panel="wardnotes" type="button" role="tab" aria-selected="false" hidden>Notes</button>
      </div>

      <div id="case-panels" class="case-panels">
        <section id="notes" class="case-panel" data-panel="overview" aria-label="Overview notes">
          <div class="stack" id="af-fields">
            <div class="notes" aria-label="Notes A to E">
              <div class="note-row">
                <div class="note-label">Dx</div>
                <div class="note-content">
                  <div id="notes-A-items" class="note-items" aria-label="Dx items"></div>
                  <button type="button" class="icon-btn small add-note-item" data-letter="A" aria-label="Add Dx header">+ Add header</button>
                </div>
              </div>
              <div class="note-row">
                <div class="note-label">Hx</div>
                <div class="note-content">
                  <div id="notes-B-items" class="note-items" aria-label="Hx items"></div>
                  <button type="button" class="icon-btn small add-note-item" data-letter="B" aria-label="Add Hx header">+ Add header</button>
                </div>
              </div>
              <div class="note-row">
                <div class="note-label">Meds</div>
                <div class="note-content">
                  <div id="notes-C-items" class="note-items" aria-label="Meds items"></div>
                  <button type="button" class="icon-btn small add-note-item" data-letter="C" aria-label="Add Meds header">+ Add header</button>
                </div>
              </div>
              <div class="note-row">
                <div class="note-label">Ix</div>
                <div class="note-content">
                  <div id="notes-D-items" class="note-items" aria-label="Ix items"></div>
                  <button type="button" class="icon-btn small add-note-item" data-letter="D" aria-label="Add Ix header">+ Add header</button>
                </div>
              </div>
              <div class="note-row">
                <div class="note-label">Issues</div>
                <div class="note-content">
                  <div id="notes-E-items" class="note-items" aria-label="Issues items"></div>
                  <button type="button" class="icon-btn small add-note-item" data-letter="E" aria-label="Add Issues header">+ Add header</button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section id="tasks" class="case-panel" data-panel="tasks" aria-label="Tasks">
          <div id="task-toolbar-root" style="margin-bottom: 8px"></div>
          <form id="task-form" class="composer" autocomplete="off">
            <button type="button" class="icon-btn" aria-hidden="true" tabindex="-1">+</button>
            <input id="task-input" placeholder="Add a task…" aria-label="Task description">
            <button type="submit" class="primary" aria-label="Add task">Add</button>
          </form>
          <div id="composer-opts" class="composer-opts" hidden>
            <label>
              Assignee
              <select id="task-assignee" class="assignee-select">
                <option value="">Unassigned (team)</option>
              </select>
            </label>
            <label>
              Priority
              <select id="task-priority">
                <option value="">None</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
              </select>
            </label>
          </div>
          <ul id="task-list"></ul>
        </section>

        <!-- HIDDEN-FEATURE: ward-notes — remove `hidden` to reinstate -->
        <section id="ward-notes" class="case-panel case-panel--drawer" data-panel="wardnotes" aria-label="Ward notes" hidden>
          <div class="case-drawer-header">
            <h3 class="case-drawer-title">Ward Notes</h3>
            <button id="ward-notes-close" class="icon-btn small case-drawer-close" type="button" aria-label="Close ward notes"><svg class="cb-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="14" height="14" fill="currentColor" aria-hidden="true"><polygon points="17.4141 16 24 9.4141 22.5859 8 16 14.5859 9.4143 8 8 9.4141 14.5859 16 8 22.5859 9.4143 24 16 17.4141 22.5859 24 24 22.5859 17.4141 16"/></svg></button>
          </div>
          <ul id="ward-notes-list" class="ward-notes-list" aria-live="polite" role="list"></ul>
        </section>
      </div>
      <div id="ward-notes-scrim" class="ward-notes-scrim" hidden></div>
    </section>

    <section id="user-detail" class="card" hidden>
      <h2 id="user-title" class="case-heading"></h2>
      <div id="user-mode-toggle" class="mode-toggle" role="tablist" aria-label="Task list view">
        <button type="button" class="mode-toggle-btn active" data-mode="me" role="tab" aria-selected="true">Mine</button>
        <button type="button" class="mode-toggle-btn" data-mode="all" role="tab" aria-selected="false">All</button>
      </div>
      <div id="user-toolbar-root" style="margin-bottom: 8px"></div>
      <ul id="user-task-list"></ul>
    </section>

    <section id="updates-section" class="card" hidden>
      <div id="updates-toolbar" class="c-toolbar c-toolbar--stack" aria-label="Updates filters">
        <div class="c-row">
          <select id="updates-user-filter" title="Filter by user" style="max-width: 220px">
            <option value="">All users</option>
          </select>
          <input id="updates-search" class="c-field--grow" type="search" placeholder="Search updates">
        </div>
      </div>
      <ul id="updates-list" class="updates-list" aria-live="polite" role="list"></ul>
      <div id="updates-footer" class="updates-footer">
        <button id="updates-load-more" class="btn" type="button">Load more</button>
      </div>
    </section>
  </main>
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>
  <button id="mobile-fab" class="mobile-fab" type="button" aria-label="New case" hidden>
    <svg class="cb-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="22" height="22" fill="currentColor" aria-hidden="true"><polygon points="17 15 17 8 15 8 15 15 8 15 8 17 15 17 15 24 17 24 17 17 24 17 24 15"/></svg>
  </button>
  <div id="mobile-sheet-root"></div>
  <div id="coach-mark-root"></div>
</body>
</html>
