<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f5f88">
  <title>Catalist — Clinical notes & tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/catalist/assets/index-T4NqXslm.js"></script>
  <link rel="stylesheet" crossorigin href="/catalist/assets/index-CPvcbF9H.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" id="brand-home">
      <span class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 12h3l2-5 4 10 2-5h5"/>
        </svg>
      </span>
      <span class="brand-meta">
        <span class="title">Catalist</span>
        <span class="subtitle">Clinical notes & tasks</span>
      </span>
    </div>
    <div class="header-right">
      <div class="session-strip" aria-live="polite">
        <span id="session-user-chip" class="session-chip">User: --</span>
        <time id="header-clock" class="session-time" datetime="">--:--</time>
      </div>
      <button id="print-open-btn" class="icon-btn small" type="button" aria-label="Print">Print</button>
      <div class="users-dropdown">
        <button id="users-btn" class="icon-btn" aria-haspopup="true" aria-expanded="false" aria-controls="users-menu">Settings ▾</button>
        <div id="users-menu" class="users-menu" role="menu" hidden>
          <div class="users-menu-header">
            <span>Users</span>
            <button id="add-user-btn" class="icon-btn small" aria-label="Add user">➕</button>
          </div>
          <ul id="user-list" class="user-list" aria-label="Users"></ul>
          <hr style="border:none;border-top:1px solid #e5e7eb;margin:6px 0;">
        <div class="users-menu-header">
          <span>Locations</span>
          <button id="add-location-btn" class="icon-btn small" aria-label="Add location">➕</button>
        </div>
        <ul id="location-list" class="user-list" aria-label="Locations"></ul>
        <hr style="border:none;border-top:1px solid #e5e7eb;margin:6px 0;">
        <div class="users-menu-header">
          <span>Tags</span>
          <button id="manage-tags-btn" class="icon-btn small" aria-label="Manage tags">⚙️</button>
        </div>
      </div>
      </div>
    </div>
  </header>
  <main class="app">
    <div id="main-tabs" class="tabs">
      <button id="tab-table" class="tab active" role="tab" aria-selected="true" aria-controls="table-section">Table</button>
      <button id="tab-my" class="tab" role="tab" aria-selected="false" aria-controls="user-detail">My Tasks</button>
      <button id="tab-updates" class="tab" role="tab" aria-selected="false" aria-controls="updates-section">Updates</button>
    </div>

    <section id="workspace-overview" class="workspace-overview workspace-overview--minimal" aria-label="Workspace overview">
      <div class="workspace-line">
        <span class="workspace-item"><strong>Catalist workspace</strong></span>
        <span class="workspace-item"><strong id="metric-visible-cases">0</strong> cases</span>
        <span class="workspace-item"><strong id="metric-open-tasks">0</strong> open</span>
        <span class="workspace-item"><strong id="metric-progress-tasks">0</strong> in progress</span>
        <span class="workspace-item"><strong id="metric-complete-tasks">0</strong> complete</span>
        <span class="workspace-item"><strong id="metric-users">0</strong> users</span>
        <span class="workspace-item"><strong id="metric-locations">0</strong> locations</span>
        <span id="metrics-throughput" class="workspace-item">Completion rate: --</span>
        <span id="metrics-updated" class="workspace-item">Last updated: --</span>
      </div>
      <div class="workspace-actions-inline">
        <button id="quick-new-case-btn" class="btn primary" type="button">New Case</button>
        <button id="quick-ward-notes-btn" class="btn" type="button">Ward Notes</button>
        <button id="quick-shortcuts-btn" class="btn" type="button">Shortcuts</button>
      </div>
    </section>

    <section id="table-section" class="card" hidden>
      <div id="table-tags-controls" class="tags-controls" aria-label="Tag filters and sort">
        <div class="left">
          <label class="ctrl">
            Location
            <select id="filter-location" multiple size="1" title="Filter by ward"></select>
          </label>
          <label class="ctrl">
            Consultant
            <select id="filter-consultant" multiple size="1" title="Filter by consultant"></select>
          </label>
        </div>
        <div class="right">
          <label class="ctrl">
            Sort by
            <select id="sort-by-tag">
              <option value="none">None</option>
              <option value="location">Location</option>
              <option value="room">Room</option>
              <option value="consultant">Consultant</option>
            </select>
          </label>
          <button id="ward-notes-print-btn" class="icon-btn small" type="button">Ward Notes</button>
          <button id="clear-tag-filters" class="icon-btn small" type="button">Clear</button>
          <button id="hide-filters-btn" class="icon-btn small" type="button" aria-label="Hide filters">Hide</button>
        </div>
      </div>
      <button id="show-filters-btn" class="show-filters-btn" type="button" hidden>Show Filters</button>
      <div id="table-root" class="table-root" aria-label="Cases table view"></div>
    </section>
    

    <section id="case-detail" class="card" hidden>
      <button id="back-btn" class="back-btn" aria-label="Back to cases">← Back</button>
      <h2 id="case-title" class="case-heading"></h2>
      <div id="case-header-actions" class="case-header-actions"></div>
      <div id="case-tag-chips" class="tag-chips" aria-label="Case tags"></div>
      <div class="tabs" role="tablist" aria-label="Case sections">
        <button id="tab-overview" class="tab active" role="tab" aria-controls="overview" aria-selected="true">Overview</button>
        <button id="tab-wardnotes" class="tab" role="tab" aria-controls="ward-notes" aria-selected="false">Notes</button>
      </div>

      <div id="case-panels">
      <section id="overview" role="tabpanel" aria-labelledby="tab-overview">
        <div class="overview-grid">
        <section id="tasks" aria-label="Tasks">
        <div id="task-toolbar-root" style="margin-bottom: 8px"></div>
        <form id="task-form" class="composer" autocomplete="off">
          <button type="button" class="icon-btn" aria-hidden="true" tabindex="-1">+</button>
          <input id="task-input" placeholder="Add a task…" aria-label="Task description">
          <button type="submit" class="primary" aria-label="Add task">Add</button>
        </form>
        <div id="composer-opts" class="composer-opts" hidden>
          <label>
            Assignee
            <select id="task-assignee" class="assignee-select">
              <option value="">Unassigned (team)</option>
            </select>
          </label>
          <label>
            Priority
            <select id="task-priority">
              <option value="">None</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </label>
        </div>
        <ul id="task-list"></ul>
        </section>

        <section id="notes" aria-label="Overview notes">
        <div class="stack" id="af-fields">
          <div class="notes" aria-label="Notes A to E">
            <div class="note-row">
              <div class="note-label">Dx</div>
              <div class="note-content">
                <div id="notes-A-items" class="note-items" aria-label="Dx items"></div>
                <button type="button" class="icon-btn small add-note-item" data-letter="A" aria-label="Add Dx header">+ Add header</button>
              </div>
            </div>
            <div class="note-row">
              <div class="note-label">Hx</div>
              <div class="note-content">
                <div id="notes-B-items" class="note-items" aria-label="Hx items"></div>
                <button type="button" class="icon-btn small add-note-item" data-letter="B" aria-label="Add Hx header">+ Add header</button>
              </div>
            </div>
            <div class="note-row">
              <div class="note-label">Meds</div>
              <div class="note-content">
                <div id="notes-C-items" class="note-items" aria-label="Meds items"></div>
                <button type="button" class="icon-btn small add-note-item" data-letter="C" aria-label="Add Meds header">+ Add header</button>
              </div>
            </div>
            <div class="note-row">
              <div class="note-label">Ix</div>
              <div class="note-content">
                <div id="notes-D-items" class="note-items" aria-label="Ix items"></div>
                <button type="button" class="icon-btn small add-note-item" data-letter="D" aria-label="Add Ix header">+ Add header</button>
              </div>
            </div>
            <div class="note-row">
              <div class="note-label">Issues</div>
              <div class="note-content">
                <div id="notes-E-items" class="note-items" aria-label="Issues items"></div>
                <button type="button" class="icon-btn small add-note-item" data-letter="E" aria-label="Add Issues header">+ Add header</button>
              </div>
            </div>
          </div>
          
        </div>
        </section>
        </div>
      </section>

      <section id="ward-notes" role="tabpanel" aria-labelledby="tab-wardnotes" hidden>
        <ul id="ward-notes-list" class="ward-notes-list" aria-live="polite" role="list"></ul>
      </section>
      </div>
    </section>

    <section id="user-detail" class="card" hidden>
      <h2 id="user-title" class="case-heading"></h2>
      <div id="user-toolbar-root" style="margin-bottom: 8px"></div>
      <ul id="user-task-list"></ul>
    </section>

    <section id="updates-section" class="card" hidden>
      <div id="updates-toolbar" class="c-toolbar c-toolbar--stack" aria-label="Updates filters">
        <div class="c-row">
          <select id="updates-user-filter" title="Filter by user" style="max-width: 220px">
            <option value="">All users</option>
          </select>
          <input id="updates-search" class="c-field--grow" type="search" placeholder="Search updates">
        </div>
      </div>
      <ul id="updates-list" class="updates-list" aria-live="polite" role="list"></ul>
      <div id="updates-footer" class="updates-footer">
        <button id="updates-load-more" class="btn" type="button">Load more</button>
      </div>
    </section>
  </main>
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>
  <!-- React toolbar script omitted on static hosting (GH Pages) -->
</body>
</html>
